name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'images/**'
      - 'screenshots/**'
      - '*.png'
      - '*.mp4'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Plan release
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-FourPartVersion([string]$version) {
            $raw = ($version -replace '^v', '').Trim()
            $parts = @($raw -split '\.' | ForEach-Object { [int]$_ })
            while ($parts.Count -lt 4) { $parts += 0 }
            if ($parts.Count -gt 4) { $parts = $parts[0..3] }
            return [int[]]$parts
          }

          function Format-FourPartVersion([int[]]$parts) {
            return ($parts -join '.')
          }

          function Compare-FourPartVersion([int[]]$left, [int[]]$right) {
            for ($i = 0; $i -lt 4; $i++) {
              if ($left[$i] -gt $right[$i]) { return 1 }
              if ($left[$i] -lt $right[$i]) { return -1 }
            }
            return 0
          }

          function Set-Output([string]$name, [string]$value) {
            "${name}=${value}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          $event = $env:GITHUB_EVENT_NAME
          $ref = $env:GITHUB_REF

          if ($event -eq 'push' -and $ref -like 'refs/tags/v*') {
            Set-Output skip false
            Set-Output mode tag
            exit 0
          }

          if ($event -eq 'workflow_dispatch') {
            Set-Output skip false
            Set-Output mode dispatch
            exit 0
          }

          if ($event -ne 'push' -or $ref -ne 'refs/heads/main') {
            throw "Unexpected workflow trigger: $event $ref"
          }

          Set-Output mode main

          [xml]$csproj = Get-Content -LiteralPath 'Aetherpath.csproj'
          $csprojVersion = ($csproj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ([string]::IsNullOrWhiteSpace($csprojVersion)) {
            throw 'Could not read Version from Aetherpath.csproj'
          }
          $csprojParts = Get-FourPartVersion $csprojVersion

          $releaseTags = @(gh release list --limit 100 --json tagName -q '.[].tagName' 2>$null)
          $latestParts = $null
          foreach ($tagName in $releaseTags) {
            if ([string]::IsNullOrWhiteSpace($tagName)) { continue }
            $parts = Get-FourPartVersion $tagName
            if (-not $latestParts -or (Compare-FourPartVersion $parts $latestParts) -gt 0) {
              $latestParts = $parts
            }
          }

          if (-not $latestParts) {
            $nextParts = $csprojParts
          } elseif ((Compare-FourPartVersion $csprojParts $latestParts) -gt 0) {
            $nextParts = $csprojParts
          } else {
            $nextParts = [int[]]@($latestParts.Clone())
            $nextParts[3] = $nextParts[3] + 1
          }

          $nextVersion = Format-FourPartVersion $nextParts
          $nextTag = "v$nextVersion"
          Write-Host "Computed next release version: $nextVersion ($nextTag)"

          $sha = $env:GITHUB_SHA
          $page = 1
          while ($true) {
            $releases = gh api "/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page" | ConvertFrom-Json
            if (-not $releases -or @($releases).Count -eq 0) { break }
            foreach ($release in @($releases)) {
              if ($release.target_commitish -eq $sha) {
                Write-Host "Commit $sha already has release $($release.tag_name); skipping."
                Set-Output skip true
                exit 0
              }
            }
            if (@($releases).Count -lt 100) { break }
            $page++
          }

          gh release view $nextTag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $nextTag already exists; skipping."
            Set-Output skip true
            exit 0
          }

          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$nextTag" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $nextTag already exists; skipping."
            Set-Output skip true
            exit 0
          }

          Set-Output skip false
          Set-Output build_version $nextVersion
          Set-Output release_tag $nextTag
          Set-Output expected_assembly_version $nextVersion

      - name: Set up .NET
        if: steps.plan.outputs.skip != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the Dalamud development distribution
        if: steps.plan.outputs.skip != 'true'
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build Aetherpath
        if: steps.plan.outputs.skip != 'true'
        shell: pwsh
        run: |
          $buildVersion = '${{ steps.plan.outputs.build_version }}'
          if ([string]::IsNullOrWhiteSpace($buildVersion)) {
            dotnet build Aetherpath.csproj -c Release
          } else {
            dotnet build Aetherpath.csproj -c Release `
              -p:Version=$buildVersion `
              -p:AssemblyVersion=$buildVersion `
              -p:FileVersion=$buildVersion
          }

      - name: Create GitHub Release
        if: steps.plan.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $built = Get-ChildItem -Path . -Recurse -Filter latest.zip |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1
          if (-not $built) { throw 'Could not find latest.zip under bin/Release' }

          [xml]$csproj = Get-Content -LiteralPath 'Aetherpath.csproj'
          $assemblyName = ($csproj.Project.PropertyGroup | Where-Object { $_.AssemblyName } | Select-Object -First 1).AssemblyName
          if ([string]::IsNullOrWhiteSpace($assemblyName)) {
            throw 'Could not read AssemblyName from Aetherpath.csproj'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($built.FullName)
          try {
            $dllEntries = @($archive.Entries | Where-Object { $_.Name -like '*.dll' })
            if ($dllEntries.Count -eq 0) {
              throw 'No plugin .dll found inside latest.zip'
            }
            $dllEntry = $dllEntries | Where-Object { [System.IO.Path]::GetFileNameWithoutExtension($_.Name) -eq $assemblyName } | Select-Object -First 1
            if (-not $dllEntry) {
              $dllEntry = $dllEntries | Select-Object -First 1
            }
            $manifestName = [System.IO.Path]::ChangeExtension($dllEntry.Name, '.json')
            $manifestEntry = $archive.Entries | Where-Object { $_.Name -eq $manifestName }
            if (-not $manifestEntry) {
              throw "Manifest $manifestName not found inside latest.zip"
            }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json }
            finally { $reader.Close() }
          } finally { $archive.Dispose() }

          $assemblyVersion = [string]$manifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($assemblyVersion)) {
            throw 'AssemblyVersion missing from plugin manifest'
          }

          $asset = Join-Path $env:RUNNER_TEMP 'latest.zip'
          Copy-Item -LiteralPath $built.FullName -Destination $asset -Force

          $mode = '${{ steps.plan.outputs.mode }}'

          if ($mode -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $assemblyVersion) {
              throw "Tag $tag ($tagVersion) does not match AssemblyVersion $assemblyVersion"
            }
            gh release create $tag $asset --title $tag --generate-notes
            exit 0
          }

          if ($mode -eq 'main') {
            $expected = '${{ steps.plan.outputs.expected_assembly_version }}'
            if ($assemblyVersion -ne $expected) {
              throw "Built AssemblyVersion $assemblyVersion does not match computed version $expected"
            }
            $tag = '${{ steps.plan.outputs.release_tag }}'
            gh release create $tag $asset --target $env:GITHUB_SHA --title $tag --generate-notes
            exit 0
          }

          if ($mode -eq 'dispatch') {
            $tag = "v$assemblyVersion"
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists; skipping."
              exit 0
            }
            gh release create $tag $asset --title $tag --generate-notes
            exit 0
          }

          throw "Unexpected release mode: $mode"
