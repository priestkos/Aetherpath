name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install the Dalamud development distribution
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build Aetherpath
        run: dotnet build Aetherpath.csproj -c Release

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $built = Get-ChildItem -Path . -Recurse -Filter latest.zip |
            Where-Object { $_.FullName -match '\\bin\\Release\\' } |
            Select-Object -First 1
          if (-not $built) { throw 'Could not find latest.zip under bin/Release' }

          [xml]$csproj = Get-Content -LiteralPath 'Aetherpath.csproj'
          $assemblyName = ($csproj.Project.PropertyGroup | Where-Object { $_.AssemblyName } | Select-Object -First 1).AssemblyName
          if ([string]::IsNullOrWhiteSpace($assemblyName)) {
            throw 'Could not read AssemblyName from Aetherpath.csproj'
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($built.FullName)
          try {
            $dllEntries = @($archive.Entries | Where-Object { $_.Name -like '*.dll' })
            if ($dllEntries.Count -eq 0) {
              throw 'No plugin .dll found inside latest.zip'
            }
            $dllEntry = $dllEntries | Where-Object { [System.IO.Path]::GetFileNameWithoutExtension($_.Name) -eq $assemblyName } | Select-Object -First 1
            if (-not $dllEntry) {
              $dllEntry = $dllEntries | Select-Object -First 1
            }
            $manifestName = [System.IO.Path]::ChangeExtension($dllEntry.Name, '.json')
            $manifestEntry = $archive.Entries | Where-Object { $_.Name -eq $manifestName }
            if (-not $manifestEntry) {
              throw "Manifest $manifestName not found inside latest.zip"
            }
            $reader = New-Object System.IO.StreamReader($manifestEntry.Open())
            try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json }
            finally { $reader.Close() }
          } finally { $archive.Dispose() }

          $assemblyVersion = [string]$manifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($assemblyVersion)) {
            throw 'AssemblyVersion missing from plugin manifest'
          }
          $asset = Join-Path $env:RUNNER_TEMP 'latest.zip'
          Copy-Item -LiteralPath $built.FullName -Destination $asset -Force

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
            $tagVersion = $tag -replace '^v', ''
            if ($tagVersion -ne $assemblyVersion) {
              throw "Tag $tag ($tagVersion) does not match AssemblyVersion $assemblyVersion"
            }
            gh release create $tag $asset --title $tag --generate-notes
          } else {
            $tag = "v$assemblyVersion"
            $null = gh release view $tag 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag already exists; skipping."
              exit 0
            }
            gh release create $tag $asset --title $tag --generate-notes
          }
