<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aetherpath mock-up walkthrough</title>
  <link rel="stylesheet" href="../../screenshots/src/imgui-mock.css" />
  <style>
    body {
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 920px;
      padding: 48px 56px;
      background: rgba(30, 31, 38, 0.92);
      border: 1px solid #3a3b45;
      border-radius: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    }
    .card h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .card h1 .gold { color: #fad872; }
    .card h1 .accent { color: #8cd1ff; }
    .warn {
      font-size: 20px;
      color: #fad872;
      margin: 20px 0 12px;
      line-height: 1.45;
    }
    .sub {
      font-size: 15px;
      color: #a6a6b3;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="game-backdrop"></div>
  <div class="card">
    <h1><span class="accent">AETHER</span><span class="gold">PATH</span> UI walkthrough</h1>
    <p class="warn">Mock-ups only — not captures from the live game.</p>
    <p class="sub">Illustrations of the Dalamud window and settings. Numbers and layout are representative; real prices come from your session’s teleport list.</p>
  </div>
</body>
</html>
